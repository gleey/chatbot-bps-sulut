<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Operator BPS Sulut</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; overflow: hidden; }
    .chat-container { height: calc(100vh - 70px); }
    .sidebar { background: #ffffff; border-right: 1px solid #e3e6f0; height: 100%; display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px 20px; background: #003366; color: white; }
    .session-list { overflow-y: auto; flex: 1; }
    .session-item { padding: 15px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.2s; }
    .session-item:hover, .session-item.active { background: #eef5fc; }
    .session-item.active { border-left: 4px solid #003366; }
    .chat-main { height: 100%; display: flex; flex-direction: column; background: #ebedd0; background-image: radial-gradient(#d1d5db 1px, transparent 0); background-size: 20px 20px; }
    .chat-header { padding: 15px 20px; background: #ffffff; border-bottom: 1px solid #e3e6f0; display: flex; justify-content: space-between; align-items: center; }
    .chat-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .chat-footer { padding: 15px 20px; background: #ffffff; border-top: 1px solid #e3e6f0; }
    .msg-bubble { max-width: 70%; padding: 10px 15px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .msg-user { align-self: flex-start; background: #ffffff; color: #333; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .msg-operator { align-self: flex-end; background: #dcf8c6; color: #000; border-bottom-right-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .msg-model { align-self: flex-start; background: #e8f4f8; color: #155724; border-bottom-left-radius: 2px; font-style: italic; border-left: 3px solid #17a2b8; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #6c757d; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3 py-2">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1 fs-5">
        <i class="bi bi-headset me-2"></i> Dashboard Operator — BPS Sulawesi Utara
      </span>
      <span class="badge bg-secondary py-2 px-3 fs-6" id="status-badge">
        <i class="bi bi-circle-fill me-1 small"></i> Memuat koneksi...
      </span>
      <form method="post" action="/operator/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-sm btn-outline-light" type="submit">Keluar</button>
      </form>
    </div>
  </nav>

  <!-- Container Main -->
  <div class="container-fluid chat-container p-0">
    <div class="row g-0 h-100">
      
      <!-- Sidebar Daftar Sesi -->
      <div class="col-md-4 col-lg-3 sidebar">
        <div class="sidebar-header d-flex justify-content-between align-items-center">
          <h6 class="m-0 fw-bold"><i class="bi bi-chat-left-text me-2"></i> Pengaduan Masuk</h6>
          <button class="btn btn-sm btn-outline-light" id="refresh-sessions" title="Refresh">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
        <div class="session-list" id="session-list">
          <div class="text-center p-4 text-muted small">Memuat daftar pengaduan...</div>
        </div>
      </div>

      <!-- Main Chat Box -->
      <div class="col-md-8 col-lg-9 h-100">
        <div id="chat-active" class="chat-main d-none">
          <div class="chat-header">
            <div>
              <h6 class="m-0 fw-bold" id="active-phone">+62 ...</h6>
              <small class="text-muted" id="active-info">Sesi Pengaduan Aktif</small>
            </div>
            <button class="btn btn-danger btn-sm" id="close-session">
              <i class="bi bi-check-circle me-1"></i> Selesaikan Sesi Operator
            </button>
          </div>

          <div class="chat-body" id="chat-messages">
            <!-- Messages -->
          </div>

          <div class="chat-footer">
            <form id="chat-form">
              <div class="input-group">
                <input type="text" id="msg-input" class="form-control" placeholder="Ketik balasan untuk pemohon..." autocomplete="off" maxlength="4096" aria-label="Balasan untuk pemohon" required>
                <button type="submit" class="btn btn-primary px-4" id="send-btn">
                  <i class="bi bi-send-fill me-1"></i> Kirim
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Empty State -->
        <div id="chat-empty" class="empty-state">
          <i class="bi bi-inbox fs-1 text-secondary mb-3"></i>
          <h5 class="fw-bold">Tidak ada sesi pengaduan terpilih</h5>
          <p class="small text-muted">Pilih nomor telepon di sebelah kiri untuk melihat pesan dan membalas pengaduan.</p>
        </div>
      </div>

    </div>
  </div>

  <script nonce="{{ csp_nonce }}">
    let activePhone = null;
    let sessionsData = [];
    let loading = false;
    const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
    const statusBadge = document.getElementById('status-badge');

    async function loadSessions() {
      if (loading) return;
      loading = true;
      try {
        const res = await fetch('/api/operator/sessions');
        if (res.status === 401) {
          window.location.assign('/operator/login');
          return;
        }
        if (!res.ok) throw new Error('Layanan tidak tersedia');
        const data = await res.json();
        if (data.status === 'ok') {
          statusBadge.textContent = 'Terhubung · polling 5 detik';
          statusBadge.className = 'badge bg-success py-2 px-3 fs-6';
          sessionsData = data.sessions;
          renderSessionList();
          if (activePhone) {
            const current = sessionsData.find(s => s.phone === activePhone);
            if (current) {
              renderMessages(current.messages);
            } else {
              selectSession(null);
            }
          }
        }
      } catch (err) {
        statusBadge.textContent = 'Koneksi gagal · coba muat ulang';
        statusBadge.className = 'badge bg-danger py-2 px-3 fs-6';
      } finally {
        loading = false;
      }
    }

    function renderSessionList() {
      const listEl = document.getElementById('session-list');
      if (sessionsData.length === 0) {
        listEl.innerHTML = '<div class="text-center p-4 text-muted small"><i class="bi bi-check2-circle fs-4 d-block mb-2 text-success"></i>Belum ada pengaduan aktif saat ini.</div>';
        return;
      }

      listEl.replaceChildren();
      sessionsData.forEach(s => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'session-item text-start border-0 w-100 ' + (s.phone === activePhone ? 'active' : '');
        const phone = document.createElement('strong');
        phone.className = 'd-block text-dark';
        phone.textContent = s.phone + ' · Pengaduan';
        const preview = document.createElement('div');
        preview.className = 'small text-muted text-truncate';
        preview.textContent = s.messages.length ? s.messages[s.messages.length - 1].text : 'Sesi dimulai';
        item.append(phone, preview);
        item.addEventListener('click', () => selectSession(s.phone));
        listEl.append(item);
      });
    }

    function selectSession(phone) {
      activePhone = phone;
      renderSessionList();

      const activeBox = document.getElementById('chat-active');
      const emptyBox = document.getElementById('chat-empty');

      if (!phone) {
        activeBox.classList.add('d-none');
        emptyBox.classList.remove('d-none');
        return;
      }

      const session = sessionsData.find(s => s.phone === phone);
      if (!session) return;

      document.getElementById('active-phone').innerText = '+' + phone;
      document.getElementById('active-info').innerText = 'Sesi Pengaduan Aktif';

      activeBox.classList.remove('d-none');
      emptyBox.classList.add('d-none');

      renderMessages(session.messages);
    }

    function renderMessages(messages) {
      const msgBox = document.getElementById('chat-messages');
      const wasNearBottom = msgBox.scrollHeight - msgBox.scrollTop - msgBox.clientHeight < 60;
      msgBox.replaceChildren();
      messages.forEach(m => {
        const bubble = document.createElement('div');
        const roles = {user: ['msg-user', 'Pengguna'], operator: ['msg-operator', 'Petugas Operator'], model: ['msg-model', 'Bot BPS']};
        const [cls, label] = roles[m.role] || roles.user;
        bubble.className = 'msg-bubble ' + cls;
        const heading = document.createElement('div');
        heading.className = 'fw-bold small mb-1 opacity-75';
        heading.textContent = label;
        const body = document.createElement('div');
        body.style.whiteSpace = 'pre-wrap';
        body.textContent = m.text;
        bubble.append(heading, body);
        msgBox.append(bubble);
      });

      if (wasNearBottom) msgBox.scrollTop = msgBox.scrollHeight;
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !activePhone) return;

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/operator/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
          body: JSON.stringify({ phone: activePhone, message: text })
        });
        const data = await res.json();
        if (data.status === 'ok') {
          input.value = '';
          await loadSessions();
        } else {
          alert('Gagal mengirim: ' + data.message);
        }
      } catch (err) {
        alert('Terjadi kesalahan: ' + err.message);
      } finally {
        sendBtn.disabled = false;
      }
    }

    async function closeSession() {
      if (!activePhone) return;
      if (!confirm(`Selesaikan sesi pengaduan untuk +${activePhone}? Percakapan akan diarsipkan dan bot akan aktif kembali.`)) return;

      try {
        const res = await fetch('/api/operator/close', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
          body: JSON.stringify({ phone: activePhone })
        });
        const data = await res.json();
        if (data.status === 'ok') {
          activePhone = null;
          await loadSessions();
        } else {
          alert('Gagal mengakhiri sesi: ' + data.message);
        }
      } catch (err) {
        alert('Terjadi kesalahan: ' + err.message);
      }
    }

    document.getElementById('refresh-sessions').addEventListener('click', loadSessions);
    document.getElementById('close-session').addEventListener('click', closeSession);
    document.getElementById('chat-form').addEventListener('submit', sendMessage);

    // Auto-refresh daftar pengaduan setiap 5 detik
    loadSessions();
    setInterval(loadSessions, 5000);
  </script>
</body>
</html>
