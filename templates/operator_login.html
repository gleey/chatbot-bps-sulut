<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Operator BPS Sulut</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 460px">
    <h1 class="h4">Login Operator BPS Sulut</h1>
    {% if error %}<p class="alert alert-danger" role="alert">{{ error }}</p>{% endif %}
    <form method="post" class="card card-body">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username" class="form-label">Nama pengguna</label>
      <input id="username" name="username" class="form-control mb-3" autocomplete="username" maxlength="100" required>
      <label for="password" class="form-label">Kata sandi</label>
      <input id="password" name="password" type="password" class="form-control mb-3" autocomplete="current-password" maxlength="1024" required>
      <button type="submit" class="btn btn-primary">Masuk</button>
    </form>
  </main>
</body>
</html>
